project:
  seed: 42
  n_jobs: 1
  output_dir: outputs
  cache_dir: cache

data:
  mode: real
  dataset: BNCI2014_001
  subjects: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  max_subjects: 3
  max_epochs_per_subject: 80
  fallback_to_synthetic: false
  synthetic:
    n_subjects: 3
    epochs_per_subject: 24
    n_channels: 8
    sfreq: 250.0
    epoch_seconds: 2.0

operators:
  cz_channel: Cz
  region_channels: [C3, Cz, C4]
  bandpasses:
    - [4.0, 30.0]
    - [8.0, 30.0]
  gains: [0.5, 2.0]
  random_dropout_ratios: [0.25, 0.5]
  resample_target_sfreq: 125.0

features:
  bandpower: true
  moments: true
  covariance: true
  correlation: true
  covariance_eigenvalues: true
  eigenvalue_count: 5
  pyriemann_tangent: false
  bands:
    delta: [1.0, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]

evaluation:
  n_splits: 3
  bootstrap_iterations: 200
  confidence_level: 0.95
  minimum_subjects_for_test: 5
  operator_models: [logistic_regression, linear_svc, random_forest]
  task_model: logistic_regression

smoke:
  max_subjects: 3
  max_epochs_per_subject: 16
  bootstrap_iterations: 50
