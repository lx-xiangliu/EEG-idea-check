[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copa-eeg-h2"
version = "0.1.0"
description = "CPU-only low-rank analysis of EEG observation-operator effects"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
real = ["mne>=1.5", "moabb>=1.0"]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
