data:
  mode: hierarchical
  n_train: 192
  n_val: 64
  n_test: 96
  seq_len: 8
  eeg_dim: 12
  audio_dim: 12
  latent_dim: 3
  n_subjects_train: 8
  n_subjects_val: 2
  n_subjects_test: 4
  noise_std: 0.25
  nuisance_std: 0.8
model:
  d_model: 24
  eeg_layers: 4
  audio_layers: 6
  n_heads: 4
  ff_mult: 2
  projection_dim: 16
  dropout: 0.0
  mapper_temperature: 0.55
train:
  seed: 0
  epochs: 10
  batch_size: 32
  learning_rate: 0.002
  weight_decay: 0.0001
  grad_clip: 1.0
  method: dda_monotonic
  normalize_residuals: true
  device: cpu
  num_workers: 0
  checkpoint_dir: outputs/checkpoints
