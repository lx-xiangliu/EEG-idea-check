[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trf-partial-attention"
version = "0.1.0"
description = "Falsification-first validation of TRF-partial attention for EEG-audio alignment"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = [
  "src", "src.data", "src.acoustics", "src.trf", "src.models",
  "src.attention", "src.losses", "src.metrics", "src.analysis",
  "src.training", "src.utils"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

